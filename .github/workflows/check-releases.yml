name: Exsite.pl Releases Watcher

on:
  schedule:
    # Uruchamiaj automatycznie co 15 minut
    - cron: '*/15 * * * *'
  push:
    branches:
      - main
  workflow_dispatch: # Przycisk "Run workflow" do ręcznego testu w GitHub Actions

jobs:
  check-releases:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Wymagane do zapisu i commitowania data/seen_posts.json
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Diagnostic curl check
        run: |
          echo "=== Testing curl from GitHub Actions runner ==="
          curl -i -s -L "https://exsite.pl/index.php?mod=rss" | head -n 30 || true

      - name: Run releases check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node run-once.js

      - name: Commit and push seen posts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen_posts.json || true
          if ! git diff-index --quiet HEAD --; then
            git commit -m "chore: aktualizacja listy wysłanych wstawek [skip ci]"
            git pull --rebase origin main || true
            git push
          else
            echo "Brak nowych wstawek do zapisania w repozytorium"
          fi
